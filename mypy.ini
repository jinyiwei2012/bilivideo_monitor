[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
ignore_missing_imports = True
# 本项目是 Windows 桌面应用（os.startfile / winreg / ctypes.windll / plyer 原生通知）。
# mypy 默认按**运行所在平台**挑平台桩：CI 跑在 ubuntu 上会按 linux 桩解析，把上述
# Windows 专有属性报成 6 条 attr-defined（本地 Windows 则 0 错），导致 CI 类型门禁
# 与开发机语义不一致。显式钉死 win32 = 与实际部署目标一致，CI/本地看到同一套桩。
platform = win32
# 项目根非包（无 __init__.py）：显式包基路径，避免同一文件被识别为
# "bilivideo_monitor.utils.x" 与 "utils.x" 两个模块名而中止检查。
explicit_package_bases = True
mypy_path = .
exclude =
    data/
    exports/
    .workbuddy/

[mypy-core.*]
disallow_untyped_defs = True

[mypy-algorithms.base]
disallow_untyped_defs = True

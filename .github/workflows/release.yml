name: Build and Release EXE

# 发版流水线：代码质量门禁 →（全绿才）编译打包 EXE → 产物尺寸校验 → exe 启动冒烟 → 发布 Release
#
# 发版流水线（两条线）：
#   dev  分支 → 预发布（prerelease=true，标签 v<ver>-pre.<时间戳>）→ 只推给客户端 beta 通道
#   main 分支 → 稳定版（标签 v<ver>）                            → 推给客户端 stable 通道
#
# 触发方式：
#   1. push 到 dev / main（自动发版）
#   2. Actions 页手动 workflow_dispatch（可显式指定发版线与版本号）
#
# 前置条件：先过完整代码质量门禁（复用 code-quality.yml），门禁不绿绝不编译。
#
# 设计约束（均由代码实测决定，勿随意改动）：
#   - 必须 onefile 单文件 BiliMonitor.exe：utils/update_checker.py 只从 release 资产里挑
#     `.exe` 并下载为 BiliMonitor_new.exe 做自替换，目录型（onedir）产物无法被更新器消费。
#   - 标签必须带语义化版本：update_checker._parse_version 取
#     `tag_name.lstrip("v").split("-")[0]` 再按 "." 切数字；旧方案的 `release-<时间戳>`
#     会解析成空元组，永远判不出新版本（等于用户永远收不到更新）。
#   - 预发布必须置 prerelease=true：stable 通道读 /releases/latest（排除 prerelease），
#     beta 通道读 /releases?per_page=5（含 prerelease）。
#   - 单资产需 < 2 GiB（GitHub 限制）：历史产物 333.7 MB，保持现状即可。
#   - 内嵌哈希必须最新：main.py 的 _INTEGRITY_HASHES 由 scripts/update_hashes.py 生成；
#     发版前校验，过期即拒绝发版（冻结 exe 跳过校验，但源码模式会因此报完整性失败）。
#   - 质量门禁复用 code-quality.yml（workflow_call），不在此处重复定义命令。

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      channel:
        description: '发版线'
        type: choice
        options: [pre, stable]
        default: pre
      version:
        description: '版本号（留空则用 __init__.py 的 __version__），例如 3.2.1'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ① 代码质量门禁：直接复用 CI 的同一套工作流（black / lint 棘轮 / bandit / radon / pytest / mypy 棘轮）
  quality:
    name: 质量门禁（发版前置）
    uses: ./.github/workflows/code-quality.yml

  # ② 编译打包：needs 保证「门禁全绿」之前绝不开始编译
  build:
    name: 编译打包并发布
    needs: [quality]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Windows runner 控制台默认非 UTF-8，脚本打印中文会抛 UnicodeEncodeError
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          # 变更日志需要完整历史与 tag（脚本按「上一个 tag..HEAD」统计）；默认 fetch-depth=1 会算出空日志
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Resolve release line, version and tag
        id: ver
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $channel = "${{ github.event.inputs.channel }}"
          if ([string]::IsNullOrWhiteSpace($channel)) {
            $channel = if ($branch -eq 'main') { 'stable' } else { 'pre' }
          }

          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $match = Select-String -Path __init__.py -Pattern '__version__\s*=\s*"([^"]+)"' | Select-Object -First 1
            if (-not $match) { throw "无法从 __init__.py 解析 __version__" }
            $ver = $match.Matches[0].Groups[1].Value
          }

          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          if ($channel -eq 'stable') {
            $tag = "v$ver"
            $rename = "BiliMonitor v$ver"
            $prerelease = 'false'
          } else {
            $tag = "v$ver-pre.$stamp"
            $rename = "BiliMonitor $tag （预发布）"
            $prerelease = 'true'
          }

          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release_name=$rename" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "分支=$branch 发版线=$channel 版本=$ver 标签=$tag 预发布=$prerelease"

      - name: Apply version override
        if: ${{ github.event.inputs.version != '' }}
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $content = Get-Content __init__.py -Raw
          $patched = [regex]::Replace($content, '__version__ = "[^"]+"', "__version__ = `"$ver`"")
          if ($patched -eq $content) { throw "版本号覆盖失败，请检查 __init__.py 的 __version__ 行" }
          [System.IO.File]::WriteAllText("$PWD/__init__.py", $patched, [System.Text.UTF8Encoding]::new($false))
          Write-Host "已把 __init__.py 的 __version__ 覆盖为 $ver（保证 exe 内自报版本与发布标签一致）"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      # 发版门禁：_INTEGRITY_HASHES 必须与当前源文件一致。
      # 冻结 exe 会跳过完整性校验，但源码模式（开发/直接跑 main.py）会因此判定被篡改。
      - name: Verify embedded integrity hashes are up to date
        shell: pwsh
        run: |
          python scripts/update_hashes.py --hashes-only
          $changed = git status --porcelain -- main.py
          if ($changed) {
            git --no-pager diff -- main.py | Select-Object -First 40
            throw "main.py 的内嵌哈希已过期。请在本地运行 `python scripts/update_hashes.py --hashes-only` 并提交后再发版。"
          }
          Write-Host "内嵌哈希与当前源文件一致"

      - name: Build with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "BiliMonitor" ^
            --collect-all bilibili_api ^
            --hidden-import plyer.platforms.win.notification ^
            --hidden-import PIL._tkinter_finder ^
            --hidden-import pandas ^
            --hidden-import sklearn ^
            --hidden-import scipy ^
            --hidden-import statsmodels ^
            --hidden-import xgboost ^
            --hidden-import lightgbm ^
            --hidden-import prophet ^
            main.py

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = Get-Item "dist\BiliMonitor.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "编译产物 dist\BiliMonitor.exe 不存在" }
          $mb = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "产物: $($exe.Name)  $mb MB"
          if ($exe.Length -lt 50MB) { throw "产物过小（$mb MB），疑为编译失败" }
          if ($exe.Length -gt 2000MB) { throw "产物超过 GitHub Release 单资产 2 GiB 限制（$mb MB）" }

      - name: Smoke test packaged exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $proc = Start-Process -FilePath "dist\BiliMonitor.exe" -PassThru
          Start-Sleep -Seconds 40
          if ($proc.HasExited) {
            throw "打包产物启动后立即退出（exit=$($proc.ExitCode)），视为坏包，已阻止发版"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "冒烟通过：exe 存活 40s（未因缺 DLL/启动异常崩溃）"

      # 变更日志：省流版写进 Release 正文（客户端读 body 展示给用户），
      # 完整版由下一步追加进 CHANGELOG.md（GitHub 上可查）
      - name: Generate changelog (client summary + full entry)
        shell: pwsh
        env:
          REL_VERSION: ${{ steps.ver.outputs.version }}
          REL_CHANNEL: ${{ steps.ver.outputs.channel }}
        run: |
          python scripts/changelog_release.py --version "$env:REL_VERSION" --channel "$env:REL_CHANNEL" `
            --out-body release_body.md --out-entry changelog_entry.md
          Write-Host "--- Release 正文（省流版，客户端可见）预览 ---"
          Get-Content release_body.md -TotalCount 16

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.release_name }}
          body_path: release_body.md
          files: dist/BiliMonitor.exe
          fail_on_unmatched_files: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}

      # 发版同时把完整版变更日志写回仓库（GitHub 可查，符合既有 CHANGELOG 版式）。
      # [skip ci] 防止这次提交再触发新的流水线；分支受保护等情况下不允许发版失败，故 best-effort。
      - name: Write full changelog into CHANGELOG.md
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/changelog_release.py --append-to CHANGELOG.md --entry changelog_entry.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if (-not (git status --porcelain -- CHANGELOG.md)) { Write-Host "CHANGELOG.md 无变化，跳过提交"; exit 0 }
          git commit -m "docs(changelog): 记录 ${{ steps.ver.outputs.tag }} [skip ci]"
          git push

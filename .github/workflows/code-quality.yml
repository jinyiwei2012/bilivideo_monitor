name: Code Quality

on:
  push:
    branches: [main, dev, develop, 'refactor/**']
  pull_request:
    branches: [main, dev, develop, 'refactor/**']
  # 供发版流水线（release.yml）复用同一套门禁：发版时由调用方保证「先过门禁再编译」
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # 统一 UTF-8，避免脚本打印中文在非 UTF-8 locale/控制台下抛 UnicodeEncodeError
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 工具版本钉死：门禁判定必须可复现，避免上游次版本更新悄悄改变结论。
          # 与本机 conda `bili` 环境对齐（black 26.5.1 / flake8 7.4.1 / bandit 1.9.4 /
          # radon 6.0.1 / pytest 9.1.1 / mypy 2.4.0）。
          pip install "black==26.5.1" "flake8==7.4.1" "bandit==1.9.4" "radon==6.0.1" "pytest==9.1.1" "mypy==2.4.0"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # PyQt6 的 wheel 自带 Qt，但依赖系统提供 libEGL/libGL/xkbcommon/xcb 等；
      # ubuntu-latest 默认没有 → 凡导入 UI 模块的测试都会 ImportError: libEGL.so.1
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      # 格式门禁：全仓必须符合 black(line-length=120)，不允许 || true
      - name: Check formatting with Black
        run: black --check --line-length=120 .

      # Lint 门禁：任何非复杂度违规即失败；复杂度按「函数名基线」棘轮，新增超标函数即失败
      - name: Lint gate (flake8 + complexity ratchet)
        run: python scripts/lint_gate.py

      # 安全门禁：-ll 只报 medium/high，现为零问题
      - name: Security scan with Bandit
        run: bandit -r . -c pyproject.toml -ll

      # 复杂度报告（仅展示，真正的门禁在 lint gate 的棘轮里）
      - name: Complexity report
        run: radon cc -a -s .

      # QT_QPA_PLATFORM=offscreen：runner 无显示器，用离屏后端建 QApplication
      - name: Run tests with Pytest
        run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen

      # 类型门禁：mypy 零容忍（历史 738 条类型错误已全部修复，基线为空）。
      # 任何新增类型错误都会使 CI 失败；如确需挂起，用 `python scripts/type_gate.py --update-baseline`。
      - name: Type gate (mypy ratchet)
        run: python scripts/type_gate.py

  # Windows 轻量矩阵：验证「本地 Windows 环境 + 静态门禁」与 ubuntu 主腿一致。
  # 刻意只跑静态三件（Black / lint / type），不跑全量 Qt pytest——
  # Windows 上 test_shutdown_qt 的 10s 事件循环既有脆性，全量测试留在 ubuntu 主腿保真。
  quality-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install tooling (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "black==26.5.1" "flake8==7.4.1" "bandit==1.9.4" "radon==6.0.1" "mypy==2.4.0"

      # 格式门禁（与 ubuntu 主腿同命令）
      - name: Check formatting with Black
        run: black --check --line-length=120 .

      # Lint 门禁（flake8 + 复杂度棘轮，读工作树 .flake8）
      - name: Lint gate (flake8 + complexity ratchet)
        run: python scripts/lint_gate.py

      # 类型门禁（mypy 棘轮；Windows 侧额外验证 mypy.ini 的 GBK 控制台解码）
      - name: Type gate (mypy ratchet)
        run: python scripts/type_gate.py
